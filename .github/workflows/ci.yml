name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Syntax-check core files
        run: |
          for f in \
            src/memory_dual.js \
            src/memory_agent.js \
            src/ollama_triage.cjs \
            src/memory_menu.js \
            src/plugin/index.js \
            src/plugin/tools.js \
            scripts/install.mjs \
            scripts/butler-supervisor.mjs \
            scripts/manual-gc.mjs ; do
            if [ -f "$f" ]; then
              node --check "$f" && echo "OK: $f" || { echo "SYNTAX FAIL: $f"; exit 1; }
            else
              echo "SKIP (absent): $f"
            fi
          done

      - name: Install (skip when no root package.json)
        run: |
          if [ -f package.json ]; then
            echo "root package.json found -> npm install"
            npm install
          else
            echo "no root package.json -> skip npm install (zero-dependency core)"
          fi

      - name: Engine self-check (stats)
        run: |
          DSH_MEMORY_ROOT="$RUNNER_TEMP/memcheck" node src/memory_dual.js stats
          echo "self-check OK"
